<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #150f33;
    --sponge: #7a4a35;
    --stripe: #ee5a82;
    --icing: #ffffff;
    --flame: #ffc533;
    --ph: clamp(100px, 26vw, 180px);   /* cỡ ảnh */
    --neon: #ff5fa2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  .stage { position: relative; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 40%, #241a52, var(--bg) 70%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ===== Bánh 3 tầng ===== */
  .cake { z-index: 2; position: absolute; left: 50%; bottom: 28%; width: 360px; height: 240px;
    transform: translateX(-50%); transform-origin: 50% 100%; }

  .plate { position: absolute; bottom: -16px; left: -35px; right: -35px; height: 18px; border-radius: 50%;
    background: linear-gradient(#ffffff, #d9cff0); box-shadow: 0 10px 30px rgba(255,95,162,.5);
    opacity: 0; }
  .halo { position: absolute; left: 50%; bottom: -60px; width: 640px; height: 640px; margin-left: -320px;
    background: radial-gradient(circle, rgba(255,95,162,.24), transparent 62%); opacity: 0; z-index: -1; }

  .tier, .candle, .cherry { opacity: 0; }

  .tier { position: absolute; left: 50%; width: var(--w); height: var(--h); bottom: var(--b);
    margin-left: calc(var(--w) / -2); border-radius: 12px;
    background:
      radial-gradient(circle, #ffe3ee 4.5px, transparent 5px) 0 100% / 20px 14px repeat-x,
      linear-gradient(#8a5340, #6b3d2c 56%, var(--st) 56% 72%, #6b3d2c 72%);
    box-shadow: inset 0 -12px 18px rgba(0,0,0,.28), 0 6px 12px rgba(0,0,0,.25); }
  /* lớp kem phủ trên mặt bánh */
  .tier::before { content: ""; position: absolute; left: -5px; right: -5px; top: -12px; height: 26px;
    border-radius: 16px; background: #fff8fb; box-shadow: 0 3px 6px rgba(0,0,0,.22); }
  /* kem chảy xuống: giọt dài xen giọt ngắn */
  .tier::after { content: ""; position: absolute; left: -5px; right: -5px; top: 8px; height: 40px;
    background:
      radial-gradient(circle at 12px 26px, #fff8fb 8px, transparent 9px) 0 0 / 40px 40px repeat-x,
      linear-gradient(90deg, transparent 4px, #fff8fb 4px 20px, transparent 20px) 0 0 / 40px 26px repeat-x,
      radial-gradient(circle at 12px 15px, #fff8fb 8px, transparent 9px) 20px 0 / 40px 40px repeat-x,
      linear-gradient(90deg, transparent 4px, #fff8fb 4px 20px, transparent 20px) 20px 0 / 40px 15px repeat-x; }

  .t1 { --w: 320px; --h: 90px; --b: 0;     --st: #f2668b; }
  .t2 { --w: 240px; --h: 76px; --b: 90px;  --st: #ffc35a; }
  .t3 { --w: 160px; --h: 62px; --b: 166px; --st: #f2668b; }

  /* anh đào trên mặt bánh */
  .cherry { position: absolute; top: -32px; width: 22px; height: 22px; border-radius: 50%; z-index: 2;
    background: radial-gradient(circle at 35% 30%, #ffb0bb 0 12%, #e01f45 42%, #8f0f2b);
    box-shadow: 0 3px 5px rgba(0,0,0,.35); }
  .cherry::before { content: ""; position: absolute; left: 10px; bottom: 80%; width: 2px; height: 16px;
    background: #4f8a3a; transform: rotate(14deg); transform-origin: 50% 100%; }
  .cherry.l { left: 10px; }
  .cherry.r { right: 10px; }

  /* nến */
  .candle { position: absolute; left: 50%; bottom: 222px; width: 12px; height: var(--h);
    margin-left: calc(var(--x) - 6px); border-radius: 3px;
    background: repeating-linear-gradient(-45deg, var(--c) 0 6px, #fff 6px 12px); }
  .candle::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 14px; height: 24px;
    margin: 0 0 3px -7px; opacity: 0; transform-origin: 50% 100%;
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    background: radial-gradient(ellipse at 50% 70%, #fff7b8 10%, var(--flame) 60%, #ff9d00);
    box-shadow: 0 0 14px 6px rgba(255,197,51,.65), 0 0 40px 16px rgba(255,160,0,.35); }

  /* Rơi xuống + nảy nhẹ */
  @keyframes drop {
    0%   { transform: translateY(-110vh); opacity: 1; }
    70%  { transform: translateY(0);      opacity: 1; }
    85%  { transform: translateY(-12px);  opacity: 1; }
    100% { transform: translateY(0);      opacity: 1; }
  }
  @keyframes show { to { opacity: 1; } }
  @keyframes flicker {
    0%,100% { transform: scale(1) rotate(-2deg); }
    50%     { transform: scale(1.08, .94) rotate(2deg); }
  }

  .go .plate  { animation: show .6s ease .1s forwards; }
  .go .t1     { animation: drop .9s ease-in .3s forwards; }
  .go .t2     { animation: drop .9s ease-in 1.1s forwards; }
  .go .t3, .go .cherry { animation: drop .9s ease-in 1.9s forwards; }
  .go .candle { animation: drop .9s ease-in 2.9s forwards; }
  .go .candle::before { animation: show .4s ease 3.9s forwards, flicker .5s ease-in-out 4.3s infinite; }
  .go .candle.b::before { animation-delay: 4.1s, 4.5s; }
  .go .candle.c::before { animation-delay: 4.3s, 4.7s; }
  .go .halo   { animation: show 1.2s ease 4s forwards; }

  /* ===== Chữ neon ===== */
  #msg { position: absolute; left: 0; right: 0; top: calc(72% + 26px); text-align: center;
    font: 600 clamp(28px, 8vw, 48px) "Dancing Script", cursive; color: #ffe6f1; min-height: 1.4em;
    text-shadow: 0 0 6px #fff, 0 0 14px var(--neon), 0 0 28px var(--neon), 0 0 48px #ff2d87; }

  /* ===== Tên + trái tim đập ===== */
  .name { position: absolute; left: 0; right: 0; top: 3%; z-index: 3; text-align: center;
    opacity: 0; pointer-events: none; }
  .go .name { animation: show 1s ease 3.6s forwards; }
  .name .nm { font: 600 clamp(28px, min(8vw, 6vh), 52px)/1 "Dancing Script", cursive; letter-spacing: .08em;
    color: #fff0f6; padding-left: .08em;
    text-shadow: 0 0 6px #fff, 0 0 16px var(--neon), 0 0 32px var(--neon), 0 0 56px #ff2d87; }
  .heart { display: block; width: clamp(30px, min(8vw, 5.5vh), 50px); margin: 8px auto 0;
    filter: drop-shadow(0 0 8px #ff2349) drop-shadow(0 0 22px rgba(255,35,73,.75));
    animation: beat 1.2s ease-in-out infinite; }
  @keyframes beat {            /* nhịp "thình-thịch" */
    0%, 100% { transform: scale(1); }
    14%      { transform: scale(1.25); }
    28%      { transform: scale(1); }
    42%      { transform: scale(1.18); }
    70%      { transform: scale(1); }
  }

  /* ===== Màn hình chạm để mở + nút nhạc ===== */
  #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; cursor: pointer; text-align: center;
    background: radial-gradient(circle at 50% 40%, #2a1d5c, #150f33 75%);
    transition: opacity .8s ease, visibility .8s; -webkit-tap-highlight-color: transparent; }
  #start.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #start .tap { font: 600 clamp(26px, 7vw, 44px)/1.2 "Dancing Script", cursive; color: #ffe6f1; padding: 0 20px;
    text-shadow: 0 0 6px #fff, 0 0 16px var(--neon), 0 0 32px var(--neon); }
  #start .sub { font: 400 14px/1.4 sans-serif; color: rgba(255,230,241,.65); letter-spacing: .04em; }
  #start svg { width: clamp(56px, 16vw, 84px); fill: #ff2349;
    filter: drop-shadow(0 0 10px #ff2349) drop-shadow(0 0 26px rgba(255,35,73,.75));
    animation: beat 1.2s ease-in-out infinite; }
  #mute { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 9;
    width: 42px; height: 42px; border: 0; border-radius: 50%; font-size: 20px; cursor: pointer;
    color: #fff; background: rgba(255,255,255,.12); backdrop-filter: blur(6px); }

  /* ===== Ảnh kỷ niệm bay lên (mờ, nghiêng, hòa vào nền) ===== */
  .photo { position: relative; flex: none; width: var(--ph); aspect-ratio: 1; margin: 0 0 10px;
    pointer-events: none;
    filter: drop-shadow(0 0 14px rgba(255,95,162,.35)); }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover;
    opacity: .8;                                  /* độ mờ: 0 = trong suốt, 1 = rõ nét */
    filter: blur(.6px) saturate(.9);              /* độ nhòe nhẹ */
    transform-origin: 50% 50%;
    transform: perspective(520px) rotateY(var(--ry)) rotateX(var(--rx)) rotateZ(var(--r));   /* nghiêng 3D */
    animation: sway3d 4.5s ease-in-out infinite;  /* lắc nhẹ qua lại cho thấy chiều sâu */
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent),
                        linear-gradient(0deg,  transparent, #000 22%, #000 78%, transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent),
                linear-gradient(0deg,  transparent, #000 22%, #000 78%, transparent);
    mask-composite: intersect; }

  /* ===== Lời chúc bay lên từ hai bên ===== */
  .wish { z-index: 4; position: absolute; top: 100%; max-width: min(38vw, 420px); display: flex; flex-direction: column; align-items: center;
    opacity: 0; pointer-events: none;
    font: 600 clamp(16px, 4.2vw, 28px)/1.3 "Dancing Script", cursive; color: #fff0f6;
    text-shadow: 0 0 2px rgba(40,10,60,.95), 0 1px 4px rgba(40,10,60,.9), 0 0 14px var(--neon), 0 0 26px var(--neon);
    animation: rise var(--rise, 9s) linear forwards; }
  .wish .wt { align-self: stretch; }
  .wish.left .wt  { text-align: left; }
  .wish.right .wt { text-align: right; }

  @keyframes sway3d {
    0%, 100% { transform: perspective(520px) rotateY(calc(var(--ry) - 9deg)) rotateX(var(--rx)) rotateZ(var(--r)); }
    50%      { transform: perspective(520px) rotateY(calc(var(--ry) + 9deg)) rotateX(calc(var(--rx) * -.6)) rotateZ(var(--r)); }
  }

  @keyframes rise {
    0%   { transform: translateY(0) translateX(0);          opacity: 0; }
    12%  { opacity: 1; }
    50%  { transform: translateY(-48vh) translateX(10px); }
    85%  { opacity: 1; }
    100% { transform: translateY(-105vh) translateX(-8px);  opacity: 0; }
  }
</style>
</head>
<body>
<div id="start">
  <svg viewBox="0 0 32 29.6" aria-hidden="true"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
  <div class="tap">Chạm để mở quà nhé</div>
  <div class="sub">bật loa lên để nghe nhạc</div>
</div>
<button id="mute" aria-label="Bật/tắt nhạc">🔊</button>
<audio id="bgm" preload="auto"></audio>

<div class="stage" id="stage">
  <canvas id="fx"></canvas>
  <div class="cake" id="cake">
    <div class="halo"></div>
    <div class="plate"></div>
    <div class="tier t1"></div>
    <div class="tier t2"></div>
    <div class="tier t3">
      <i class="cherry l"></i><i class="cherry r"></i>
    </div>
    <div class="candle a" style="--x:0px;   --h:78px; --c:#ff5d8f"></div>
    <div class="candle b" style="--x:-30px; --h:62px; --c:#4aa3ff"></div>
    <div class="candle c" style="--x:30px;  --h:62px; --c:#ffc13a"></div>
  </div>
  <h1 id="msg"></h1>
  <div class="name">
    <div class="nm">LINH</div>
    <svg class="heart" viewBox="0 0 32 29.6" aria-label="trái tim">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff6a85"/><stop offset="1" stop-color="#e0102f"/></linearGradient></defs>
      <path fill="url(#hg)" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
    </svg>
  </div>
</div>

<script>
  const TEXT = "Happy Birthday my Love!";   // ← đổi lời chúc ở đây
  const stage = document.getElementById("stage");
  const msg = document.getElementById("msg");
  const cv = document.getElementById("fx");
  const ctx = cv.getContext("2d");
  const COLORS = ["#ffffff", "#ffd23f", "#ff7eb6", "#fff1c9"];
  let W, H, dots = [], sparks = [], timers = [], typer;


  // Co giãn bánh cho vừa mọi màn hình
  const cake = document.getElementById("cake");
  function fit() {
    const k = Math.min(1, innerWidth * .9 / 400, innerHeight * .5 / 370);
    cake.style.transform = "translateX(-50%) scale(" + k + ")";
  }
  addEventListener("resize", fit); fit();

  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener("resize", resize); resize();

  const rand = (a, b) => a + Math.random() * (b - a);

  // Hạt sáng bay nền
  for (let i = 0; i < 80; i++) {
    dots.push({ x: rand(0, W), y: rand(0, H), r: rand(1, 4),
      vy: rand(-.4, -.05), vx: rand(-.15, .15),
      c: COLORS[i % COLORS.length], t: rand(0, 6) });
  }

  // Pháo hoa
  function burst(x, y) {
    const c = COLORS[Math.floor(rand(1, 4))];
    for (let i = 0; i < 70; i++) {
      const a = rand(0, Math.PI * 2), s = rand(.5, 3.2);
      sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c });
    }
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    for (const d of dots) {
      d.x += d.vx; d.y += d.vy; d.t += .03;
      if (d.y < -5) { d.y = H + 5; d.x = rand(0, W); }
      ctx.globalAlpha = .55 + Math.sin(d.t) * .35;
      ctx.fillStyle = d.c;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
    }
    sparks = sparks.filter(p => p.life > 0);
    for (const p of sparks) {
      p.x += p.vx; p.y += p.vy; p.vy += .03; p.vx *= .985; p.life -= .012;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x, p.y, 2.5, 2.5);
    }
    requestAnimationFrame(loop);
  }
  loop();

  // Gõ chữ từng ký tự
  function type() {
    let i = 0;
    typer = setInterval(() => {
      msg.textContent = TEXT.slice(0, ++i);
      if (i >= TEXT.length) clearInterval(typer);
    }, 110);
  }

  // Lời chúc bay lên từ hai bên (thêm câu mới vào đây, nhớ có dấu phẩy)
  const WISHES = [
    "Chúc mừng sinh nhật, công chúa của anh",
    "Cảm ơn số mệnh đã đưa em đến bên anh",
    "Chúc em tuổi 24 mọi điều như ý, luôn gặp nhiều may mắn và mãi là cô gái ngọt ngào nhất của anh",
    "Chúc em tuổi mới luôn bình an, trẻ trung và hạnh phúc",
    "Chúc em sang tuổi mới bớt bướng và yêu thương anh nhiều hơn nhoa",
    "Chúc tuổi mới thêm trưởng thành để vững vàng trước những thử thách, đủ mạnh mẽ để theo đuổi ước mơ và đủ bình yên để tận hưởng những điều giản dị trong cuộc sống",
    "Cảm ơn vì đã đến"
  ];

  // Một cụm lời chúc: ảnh ở trên, chữ nằm ngay bên dưới ảnh, cùng bay lên một lúc
  function buildWish(text, side, src) {
    const el = document.createElement("div");
    el.className = "wish " + side;
    if (src) {
      const pic = document.createElement("div");
      pic.className = "photo";
      const img = new Image();
      img.src = src; img.alt = "";
      // nghiêng trong không gian 3D: ảnh quay mặt về phía giữa màn hình
      const sign = side === "left" ? 1 : -1;
      img.style.setProperty("--ry", sign * rand(26, 36) + "deg");   // quay quanh trục dọc
      img.style.setProperty("--rx", rand(-10, 12) + "deg");         // ngả ra trước / ra sau
      img.style.setProperty("--r", -sign * rand(5, 10) + "deg");    // nghiêng chéo nhẹ trên mặt phẳng
      pic.appendChild(img);
      el.appendChild(pic);
    }
    const wt = document.createElement("div");
    wt.className = "wt";
    wt.textContent = text;
    el.appendChild(wt);
    el.style[side] = rand(2, 9) + "%";   // lệch ngang ngẫu nhiên cho tự nhiên
    return el;
  }

  function spawnWish(text, side, src) {
    const el = buildWish(text, side, src);
    stage.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }

  // Kịch bản: bánh rơi → nến → tên + trái tim → chữ gõ → pháo hoa → lặp lại
  function play() {
    timers.forEach(clearTimeout); clearInterval(typer);
    document.querySelectorAll(".wish, .photo").forEach(w => w.remove());
    msg.textContent = "";
    stage.classList.remove("go"); void stage.offsetWidth; stage.classList.add("go");

    const later = (fn, ms) => timers.push(setTimeout(fn, ms));
    later(type, 4700);

    // Mỗi lời chúc bay lên cùng ảnh gắn với nó (WISH_PHOTOS): ảnh ở trên, chữ ngay bên dưới.
    // Thứ tự bên: trái, phải, trái, phải, ... Mỗi cụm chỉ bay lên khi cụm trước CÙNG BÊN
    // đã bay đủ xa, nên chữ dài hay ảnh to cũng không bao giờ đè lên nhau.
    const STEP_MIN = 2400;      // khoảng cách tối thiểu giữa hai lời chúc liên tiếp (mili giây)
    const GAP = 48;             // khoảng trống tối thiểu giữa hai cụm cùng bên (px)
    const attached = typeof WISH_PHOTOS !== "undefined" ? WISH_PHOTOS : {};
    const vh = innerHeight / 100;

    // Đo chiều cao thật của cả cụm (ảnh + chữ) trên màn hình hiện tại
    function clusterHeight(text, side, src) {
      const el = buildWish(text, side, src);
      el.style.visibility = "hidden";
      el.style.animation = "none";
      stage.appendChild(el);
      const h = el.offsetHeight;
      el.remove();
      return h;
    }

    // ===== Lập lịch cho vừa khít với bài nhạc =====
    // Cụm cuối cùng phải bay khuất đúng lúc bài nhạc hết (tiếng hát tắt dần ở cuối đoạn nhạc).
    // Trang tự thử rút ngắn thời gian bay lên (RISE_MAX → RISE_MIN) cho tới khi tất cả vừa trong bài nhạc;
    // nếu còn dư thời gian thì dời cả lịch về sau để cụm cuối kết thúc đúng lúc nhạc hết.
    const RISE_MAX = 9000;     // thời gian bay lên chậm nhất của mỗi cụm (mili giây)
    const RISE_MIN = 7000;     // nhanh nhất vẫn đủ để đọc được câu dài
    const FIRST = 5000;        // lời chúc đầu tiên bay lên sau phần mở đầu (bánh rơi, nến sáng)
    const MUSIC_MS = (isFinite(bgm.duration) && bgm.duration > 5) ? bgm.duration * 1000 : 28080;
    const sideOf = k => (k % 2 === 0 ? "left" : "right");
    const heights = WISHES.map((text, k) => clusterHeight(text, sideOf(k), attached[k]));

    // Lịch bay nếu mỗi cụm bay lên trong D mili giây (khớp với @keyframes rise: 48vh ở nửa đầu, 57vh ở nửa sau)
    function plan(D) {
      const toRise = d => d <= 48 * vh
        ? (D / 2) * d / (48 * vh)
        : Math.min(D, D / 2 + (D / 2) * (d - 48 * vh) / (57 * vh));
      const lastOn = {}, times = [];
      let prevT = 0;
      WISHES.forEach((_, k) => {
        const side = sideOf(k);
        let t = k === 0 ? FIRST : prevT + STEP_MIN;
        const prev = lastOn[side];
        // cụm mới xuất hiện từ mép dưới màn hình: cụm trước cùng bên phải bay lên hết chiều cao của nó + khoảng trống
        if (prev) t = Math.max(t, prev.t + toRise(prev.h + GAP));
        times.push(t); lastOn[side] = { t, h: heights[k] }; prevT = t;
      });
      return { times, end: times[times.length - 1] + D };
    }

    let D = RISE_MAX, p = plan(D);
    while (p.end > MUSIC_MS && D > RISE_MIN) { D -= 100; p = plan(D); }
    const shift = Math.max(0, MUSIC_MS - p.end);       // dư bao nhiêu thì dời lịch bấy nhiêu
    stage.style.setProperty("--rise", D + "ms");
    p.times.forEach((t, k) =>
      later(() => spawnWish(WISHES[k], sideOf(k), attached[k]), t + shift));

    // Hết bài nhạc + hết lời chúc → nghỉ MUSIC_GAP → nhạc và hiệu ứng cùng bắt đầu lại
    const SHOW_END = Math.max(MUSIC_MS, p.end + shift);
    for (let i = 0; i < Math.floor((SHOW_END - FIRST) / 1000); i++)
      later(() => burst(rand(W * .2, W * .8), rand(H * .08, H * .32)), FIRST + i * 1000);
    later(restart, SHOW_END + MUSIC_GAP);
  }
  // Trình duyệt chỉ cho phát nhạc sau khi người xem chạm vào màn hình,
  // nên cả nhạc lẫn hiệu ứng bắt đầu khi bấm vào màn hình mở đầu.
  const bgm = document.getElementById("bgm");
  const startEl = document.getElementById("start");
  const muteBtn = document.getElementById("mute");
  let started = false;

  function startShow() {
    if (started) return;
    started = true;
    startEl.classList.add("hide");
    bgm.volume = .8;                         // âm lượng: 0 đến 1
    bgm.play().catch(() => {});
    play();
  }

  // Bắt đầu vòng mới: nhạc phát lại từ đầu cùng lúc với hiệu ứng
  function restart() {
    bgm.currentTime = 0;
    bgm.play().catch(() => {});
    play();
  }
  startEl.addEventListener("click", startShow);

  const MUSIC_GAP = 2000;                    // thời gian nghỉ giữa hai vòng (2 giây)

  muteBtn.addEventListener("click", () => {
    bgm.muted = !bgm.muted;
    muteBtn.textContent = bgm.muted ? "🔇" : "🔊";
  });
</script>
